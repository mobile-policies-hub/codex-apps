<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Store screenshots</title>
  <style>
    body {
      margin: 0;
      background: #0b0d12;
      color: #f8fafc;
      font: 16px/1.4 "Segoe UI", sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 20px 24px 12px;
      background: rgba(11, 13, 18, 0.92);
      backdrop-filter: blur(12px);
    }
    h1 { margin: 0 0 12px; font-size: 22px; }
    nav a {
      color: #f8fafc;
      margin-right: 16px;
      text-decoration: none;
    }
    section { padding: 12px 24px 48px; }
    h2 { margin: 8px 0 20px; font-size: 18px; letter-spacing: 0.08em; }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
    }
    figure { margin: 0; width: min(420px, 100%); }
    img {
      width: 100%;
      height: auto;
      border-radius: 18px;
      display: block;
      background: #111;
    }
    figcaption { margin-top: 8px; color: #94a3b8; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>App Store screenshots</h1>
    <nav>
      <a href="#ancient">Ancient Codex</a>
      <a href="#zenith">Zenith Habits</a>
      <a href="#apex">Apex Calc</a>
    </nav>
  </header>
  <section id="ancient">
    <h2>ANCIENT CODEX</h2>
    <div class="row">
      <figure><img src="ancient_codex/01_explore_ancient_history.png" alt="Explore Ancient History and Myths" /><figcaption>1. Explore Ancient History &amp; Myths</figcaption></figure>
      <figure><img src="ancient_codex/02_test_your_knowledge.png" alt="Test Your Knowledge Daily" /><figcaption>2. Test Your Knowledge Daily</figcaption></figure>
      <figure><img src="ancient_codex/03_discover_glyphs.png" alt="Discover Rare Artifacts and Glyphs" /><figcaption>3. Discover Rare Artifacts &amp; Glyphs</figcaption></figure>
      <figure><img src="ancient_codex/04_track_learning_progress.png" alt="Track Your Learning Progress" /><figcaption>4. Track Your Learning Progress</figcaption></figure>
    </div>
  </section>
  <section id="zenith">
    <h2>ZENITH HABITS</h2>
    <div class="row">
      <figure><img src="zenith_habits/01_build_daily_habits.png" alt="Build Unstoppable Daily Habits" /><figcaption>1. Build Unstoppable Daily Habits</figcaption></figure>
      <figure><img src="zenith_habits/02_visualize_growth.png" alt="Visualize Your Personal Growth" /><figcaption>2. Visualize Your Personal Growth</figcaption></figure>
      <figure><img src="zenith_habits/03_customize_routine.png" alt="Customize Your Ideal Routine" /><figcaption>3. Customize Your Ideal Routine</figcaption></figure>
      <figure><img src="zenith_habits/04_stay_accountable.png" alt="Stay Accountable Every Day" /><figcaption>4. Stay Accountable Every Day</figcaption></figure>
    </div>
  </section>
  <section id="apex">
    <h2>APEX CALC</h2>
    <div class="row">
      <figure><img src="apex_calc/01_financial_calculations.png" alt="Advanced Financial Calculations" /><figcaption>1. Advanced Financial Calculations</figcaption></figure>
      <figure><img src="apex_calc/02_currency_conversion.png" alt="Instant Currency Conversion" /><figcaption>2. Instant Currency Conversion</figcaption></figure>
      <figure><img src="apex_calc/03_reports_and_history.png" alt="Export Reports and Save History" /><figcaption>3. Export Reports &amp; Save History</figcaption></figure>
      <figure><img src="apex_calc/04_math_and_units.png" alt="Smart Math and Unit Tools" /><figcaption>4. Smart Math &amp; Unit Tools</figcaption></figure>
    </div>
  </section>
</body>
</html>
